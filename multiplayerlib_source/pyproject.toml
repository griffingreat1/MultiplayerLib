requires-python = ">=3.10"
dependencies = [
    "cryptography==50.0.1",
    "orjson==3.12.0",
]
readme = "README.md"
authors = [
  {name="griffingreat1"},
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"