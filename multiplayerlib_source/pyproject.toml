[project]
name = "multiplayerlib"
version = "0.1.3"
description = "MultiplayerLib - A highly compatable and lightweight Python multiplayer networking library for game development"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=3.4.8",
    "orjson>=3.9.0",
]
readme = "README.md"
authors = [
  {name="griffingreat1"},
]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"